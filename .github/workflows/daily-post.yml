name: Daily trend post

on:
  schedule:
    # 매일 00:00 UTC = 한국시간 오전 9시
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 오늘의 글 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_post.py

      - name: 사이트 빌드
        run: python build.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add posts docs
          git diff --cached --quiet || git commit -m "새 트렌드 글 자동 발행: $(date +'%Y-%m-%d')"
          git push
